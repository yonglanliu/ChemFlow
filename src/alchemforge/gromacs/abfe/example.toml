[project]
name = "ligand_abfe"
work_dir = "/path/to/work"

[system]
# For membrane ABFE, set type="membrane" and supply a fully prepared ABFE
# setup directory. Automatic pdb2gmx/solvation is intentionally bypassed.
type = "soluble"
protein = "/path/to/protein.pdb"
gromacs_command = "gmx"
force_field = "amber99sb-ildn"
water_model = "tip3p"
box_distance = 1.2
ion_concentration = 0.15
temperature_k = 300.0
pressure_bar = 1.0
# prepared_setup_dir = "/path/to/prepared_abfe"
# membrane_normal = "z"
# lipid_resnames = ["POPC", "POPE", "CHOL"]
# minimum_lipids = 20
# reference_pressure_bar = [1.0, 1.0]
# compressibility_bar = [4.5e-5, 4.5e-5]
# refcoord_scaling = "com"

[ligand]
sdf = "/path/to/ligand.sdf"
resname = "LIG"
charge = 0

[topology]
backend = "pmx"
charge_method = "bcc"

[restraints]
method = "boresch"
seed = 2026
distance_force_constant = 4184.0
angle_force_constant = 41.84
dihedral_force_constant = 41.84

[simulation]
replicas = 1
lambda_windows = 21
lambda_function = "cosine" # cosine, linear, or power
lambda_power = 2.0
timestep_ps = 0.002
equilibration_ns = 1.0
production_ns = 5.0
decouple_coulomb_first = true
softcore_alpha = 0.5

[execution]
mode = "local" # local or slurm
max_parallel_jobs = 3
mdrun_options = ["-ntmpi", "1"]
# Optional advanced override; normally use AlchemForge's built-in worker:
# worker_script = "/path/to/ABFE_GROMACS.sh"

[slurm]
partition = "gpu"
nodes = 1
tasks = 1
cpus_per_task = 8
gpus = 1
memory = "16G"
walltime = "24:00:00"
