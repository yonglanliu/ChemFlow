# PyRosetta for ChemFlow's `chemflow protac pyrosetta-dock`.
#
# PyRosetta powers the in-process PROTAC ternary docking (global/local search +
# optional linker-aware restraint). Because that step imports PyRosetta IN-PROCESS,
# PyRosetta must be importable in the SAME environment that runs `chemflow`.
# So the simplest setup is to add PyRosetta to your existing `chemflow` env:
#
#   conda activate chemflow
#   pip install pyrosetta-installer
#   python -c "import pyrosetta_installer; pyrosetta_installer.install_pyrosetta()"
#   python -c "import pyrosetta; pyrosetta.init()"   # verify
#
# PyRosetta is self-contained (bundles the compiled Rosetta engine + database); its
# only real dependency is a supported Python (3.6-3.14; the chemflow env's 3.11 is
# fine), so conflict risk with the rest of the env is low.
#
# License: free for academic / non-commercial use (request from UW CoMotion);
# fee-for-service and commercial use require a paid license. The installer/conda
# package prompts you to accept the license. See https://www.pyrosetta.org/downloads
#
# Alternatively, conda from the RosettaCommons channel (into the chemflow env):
#   conda install -c https://conda.rosettacommons.org pyrosetta
#
# This standalone env is only useful if you run pyrosetta-dock separately from
# ChemFlow; for the integrated CLI/desktop, install PyRosetta into the chemflow env
# as above instead.

name: pyrosetta

channels:
  - conda-forge

dependencies:
  - python=3.11
  - pip
  - pip:
      - pyrosetta-installer
