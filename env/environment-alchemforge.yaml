name: alchemforge

# Workstation environment (macOS or Linux) for the free-energy stack: OpenFE,
# OpenMM, GROMACS/PMX RBFE, Open Babel + ACPYPE. It is headless — the GUI is
# ChemFlow Studio (`chemflow-desktop`, installed in the ChemFlow environment),
# which runs these tools through this env. Keeping it separate from env/environment.yaml
# stops OpenFE's NumPy 1.x / RDKit pins from disturbing the ML stack.
#
# Create it, then link ChemFlow in editable (development) mode:
#   mamba env create -f env/environment-alchemforge.yaml
#   mamba activate alchemforge
#   python -m pip install -e . --no-deps --no-build-isolation     # chemflow + alchemforge
#   python -m pip install ./pmx --no-deps --no-build-isolation    # PMX (GROMACS hybrids)
# or do all of it with:  scripts/dev_install.sh
# (`chemflow fe-env install`, used by the desktop Environments page, installs the
# same package pins; tests/test_chemflow_fe_env_install.py keeps them in sync.)
#
# For NVIDIA GPU HPC nodes use env/environment-alchemforge-hpc.yaml instead.
channels:
  - conda-forge

dependencies:
  - python=3.12
  - pip

  # Alchemical and molecular-simulation stack.
  #
  # openfe brings gufe, openmmtools, openmmforcefields, lomap2, kartograf,
  # konnektor, cinnabar, pymbar, plugcli and the openff-* stack transitively.
  # These were briefly listed explicitly while openfe was vendored in-repo;
  # that fork was reverted on 2026-11-13 (its membrane hook turned out to be
  # unreachable — ProteinMembraneComponent subclasses SolvatedPDBComponent, so
  # OpenFE never solvates a membrane system and never enters that branch).
  - openfe=1.12
  # openff-nagl is needed for `partial_charge_method: nagl`; pinned explicitly
  # because it is an extra rather than a hard dependency of openfe.
  - openff-nagl
  - openff-nagl-models

  - openfe-analysis
  - openmm=8.4.0
  - openff-toolkit
  - gromacs
  - ambertools
  - acpype
  - openbabel
  - pdbfixer
  - parmed
  - mdtraj
  - alchemlyb
  - mpi4py

  # Scientific stack. The validated alchemforge env runs NumPy 2.4.6 with the
  # MKL BLAS build, so the old "OpenFE needs NumPy 1.x" pin is stale and would
  # stop a fresh env reproducing it. RDKit stays capped: AmberTools still needs
  # a pre-2026.03 build.
  - "numpy>=2.0,<3"
  - "pandas>=2.1,<3"
  - "rdkit>=2024.03,<2026.03"
  - scipy
  - matplotlib
  - pyyaml
  - pillow

  # Build support
  - "setuptools>=80,<82"
  - wheel
  - cmake

  # Pip-only helpers (the compiled stack above is never installed by pip).
  - pip:
      - pytest
      - requests
      - rich
      - platformdirs
