# ===================================================================
# ChemFlow HPC settings — SITE overrides for the shared presets.
#
# Built-in presets ship per MODULE in src/hpc/presets/ :
#
#     docking.yaml    screening.yaml    openfe.yaml
#     gromacs.yaml    openmm.yaml       mmgbsa.yaml
#
# This file overrides them for your cluster. Lookup order (first found wins):
#   1. $CHEMFLOW_HPC_CONFIG
#   2. <repo>/env/hpc.yaml          (this file)
#   3. ~/.config/chemflow/hpc.yaml  (per-user override)
#
# Resolution per module:
#   src/hpc/presets/_common.yaml
#     -> this file's top-level `defaults:` / `gpu_types:`   (site-wide)
#     -> src/hpc/presets/<module>.yaml                      (module intent)
#     -> this file's `<module>:` section                    (the last word)
#
# Module intent deliberately beats the top-level defaults, so a site-wide
# `partition: gpu` does not turn the CPU-only MM-GBSA preset into a GPU job.
# To change one module, use its section below.
#
# A preset is EITHER a walltime string (single node, single GPU) OR a mapping
# of any of: time, nodes, ntasks, cpus_per_task, gpus, gpu_type, mem,
# partition, account, conda_env, constraint, replicates, shards.
# Aliases are accepted: walltime=time, memory=mem, gpus_per_node=gpus,
# ntasks_per_node=ntasks, conda_environment=conda_env.
#
# SLURM arrays are always plain 0-N — this project never caps concurrency
# with %N, so the scheduler decides how many tasks run at once.
# ===================================================================

# ---- Site-wide defaults (every module, unless its own file says otherwise) ---
defaults:
  partition: gpu
  account: ""                # "" -> no #SBATCH --account line

# ---- Selectable --gres GPU types. "" = any GPU. ----------------------------
# ONE list, read by every CLI and desktop dropdown. Match your cluster's gres
# names (`sinfo -o "%G"` on SLURM).
gpu_types:
  - ""          # any GPU
  - a100
  - a100x
  - v100
  - v100x
  - p100
  - l40
  - gpuh200     # H200 nodes
  - h100
  - a40
  - rtx8000

# ---- Legacy: presets here feed the OpenFE and docking paths ----------------
# Kept so existing user files keep working. New presets belong in a module
# section below.
presets:
  singlenode-singlegpu-quick: "04:00:00"
  singlenode-singlegpu-day: "1-00:00:00"
  singlenode-singlegpu-long: "4-00:00:00"
  singlenode-singlegpu-week: "7-00:00:00"
  singlenode-singlegpu-tendays: "10-00:00:00"

# ------------------------------------------------------------------
# AI docking / co-folding (Boltz-2, Chai-1, DiffDock-L) — one ligand per job.
# Single-GPU inference, short per complex. Throughput lives in `screening`.
# ------------------------------------------------------------------
docking:
  default_preset: docking-standard
  defaults:
    conda_env: chemflow      # env that imports alchemfold; the ENGINE runs from
                             # its own env (boltz / chai / diffdock), by path
  presets:
    docking-quick: "01:00:00"
    docking-standard: "04:00:00"
    docking-long: "1-00:00:00"
    docking-xlong: "2-00:00:00"
    docking-2gpu:
      time: "1-00:00:00"
      gpus: 2
      gpu_type: a100
      mem: 64G

# ------------------------------------------------------------------
# Virtual screening — library -> shards -> SLURM array (1 task per shard).
#   shards = array tasks = GPUs in parallel;  gpus > 1 enables Boltz DDP.
# ------------------------------------------------------------------
screening:
  default_preset: screen-1gpu-x20
  defaults:
    conda_env: chemflow
  presets:
    screen-1gpu-x4:   {time: "1-00:00:00", gpus: 1, shards: 4}
    screen-1gpu-x20:  {time: "1-00:00:00", gpus: 1, shards: 20}
    screen-1gpu-x50:  {time: "1-00:00:00", gpus: 1, shards: 50}
    screen-l40-x20:   {time: "1-00:00:00", gpus: 1, gpu_type: l40, shards: 20}
    screen-h200-x10:  {time: "1-00:00:00", gpus: 1, gpu_type: gpuh200, shards: 10}
    screen-4gpu-x5:   {time: "1-00:00:00", gpus: 4, gpu_type: a100, shards: 5, mem: 64G}

# ------------------------------------------------------------------
# OpenFE binding free energy (RBFE / ABFE / SepTop).
# Per-job resources also live in an inline `slurm:` block inside each config;
# that block always wins. The values here seed a newly generated one.
# ------------------------------------------------------------------
openfe:
  defaults:
    cpus_per_task: 16
    mem: 32G
    time: "240:00:00"
    replicates: 3            # array size = N_transformation_json * replicates
    conda_env: alchemforge

# ------------------------------------------------------------------
# GROMACS / PMX free energy (RBFE, ABFE, SepTop, resFEP, alanine scan).
# One array task per lambda window; 1 GPU + 4-8 CPU per window is the useful
# range. `constraint` maps to #SBATCH --constraint.
# ------------------------------------------------------------------
gromacs:
  default_preset: gmx-1gpu-day
  defaults:
    cpus_per_task: 8
    mem: 16G
    conda_env: alchemforge
  presets:
    gmx-1gpu-short: "08:00:00"
    gmx-1gpu-day: "24:00:00"
    gmx-1gpu-long: "2-00:00:00"
    gmx-hrex-8win:           # HREX: one task per window, MPI across them
      time: "2-00:00:00"
      ntasks: 8
      cpus_per_task: 1
      mem: 32G
    gmx-a100-day: {time: "24:00:00", gpu_type: a100}

# ------------------------------------------------------------------
# OpenMM modeling + MD (build-soluble / build-membrane / relax-membrane / md).
# One single-GPU job per step, no array.
# ------------------------------------------------------------------
openmm:
  default_preset: openmm-1gpu-2day
  defaults:
    cpus_per_task: 8
    mem: 32G
    conda_env: alchemforge
  presets:
    openmm-build: "04:00:00"
    openmm-relax: "12:00:00"
    openmm-1gpu-2day: "48:00:00"
    openmm-1gpu-week: "7-00:00:00"
    openmm-a100-2day: {time: "48:00:00", gpu_type: a100}

# ------------------------------------------------------------------
# MM-GBSA endpoint rescoring — CPU only (gpus: 0 omits the --gres line).
# ------------------------------------------------------------------
mmgbsa:
  default_preset: mmgbsa-cpu-8h
  defaults:
    partition: norm
    cpus_per_task: 4
    gpus: 0
    mem: 8G
    conda_env: alchemforge
  presets:
    mmgbsa-cpu-2h: "02:00:00"
    mmgbsa-cpu-8h: "08:00:00"
    mmgbsa-cpu-day: "24:00:00"
