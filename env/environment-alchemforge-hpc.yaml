name: alchemforge

# Linux HPC environment (NVIDIA GPU compute nodes): same free-energy stack as
# environment-alchemforge.yaml, headless (no Qt/GUI libraries) and with the CUDA
# user-space toolkit. The cluster supplies the NVIDIA driver; conda does not.
# CUDA 12.6 is the last line that still supports Pascal GPUs (e.g. Tesla P100);
# newer GPUs (Blackwell) need a newer CUDA pin.
#
# Create it (any directory) and link ChemFlow:
#   conda env create -n alchemforge -f environment-alchemforge-hpc.yaml
#   conda activate alchemforge
#   python -m pip install -e /path/to/ChemFlow --no-deps --no-build-isolation
#   python -m pip install /path/to/ChemFlow/pmx --no-deps --no-build-isolation
# Equivalent one-liner (also pins CUDA and installs PMX):
#   chemflow fe-env install --cuda 12.6
#
# Test CUDA from an allocated GPU node (not the login node):  alchemforge gpu-test
# Replica-exchange (HREX) needs an external MPI GROMACS (gmx_mpi, e.g. a cluster
# module); the GROMACS from conda is thread-MPI. Set it on the Job tab / [execution].
channels:
  - conda-forge

dependencies:
  - python=3.12
  - pip

  # Alchemical and molecular-simulation stack
  - openfe=1.12
  - openmm=8.4.0
  - openff-toolkit
  - gromacs
  - ambertools
  - acpype
  - openbabel
  - pdbfixer
  - parmed
  - mdtraj
  - alchemlyb
  - mpi4py

  # NVIDIA user-space toolkit for OpenMM and CUDA GROMACS. NVRTC (in the toolkit)
  # is required because OpenMM compiles CUDA kernels at runtime.
  - cuda-version=12.6
  - cuda-toolkit=12.6

  # Scientific stack (same pins as the workstation environment).
  - "numpy>=1.26,<2"
  - "pandas>=2.1,<3"
  - "rdkit>=2024.03,<2026.03"
  - scipy
  - matplotlib
  - pyyaml
  - pillow

  # Build support (PMX and some wheels compile on install)
  - "setuptools>=80,<82"
  - wheel
  - cmake
  - make
  - compilers

  # Headless utilities only. Qt/VTK/3D-viewer packages are deliberately omitted;
  # use the workstation environment for the GUI.
  - pip:
      - pytest
      - requests
      - rich
      - platformdirs
