name: chemflow

channels:
  - conda-forge

dependencies:
  - python=3.11
  - pip

  # Native and compiled dependencies are installed by Conda first.
  - lightgbm=4.7.0
  - llvmlite=0.47.0
  - matplotlib=3.11.0
  - numba=0.65.1
  - numpy=2.4.6
  - pandas=3.0.3
  - pillow=12.2.0
  - pyarrow=24.0.0
  - rdkit=2026.03.3
  - scikit-learn=1.9.0
  - scipy=1.17.1
  - statsmodels=0.14.6
  - xgboost=3.2.0

  # Pip installs the remaining pinned packages and this local project.
  - pip:
      - -r requirements-torch.txt
