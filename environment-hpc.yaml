name: chemflow

channels:
  - conda-forge
  - nvidia

dependencies:
  - python=3.11
  - pip
  # Hugging Face Graphormer's legacy preprocessing extension requires Cython <3.
  - cython=0.29.37

  # Native and compiled dependencies are installed by Conda first.
  - lightgbm=4.7.0
  - llvmlite=0.47.0
  - matplotlib=3.11.0
  - numba=0.65.1
  - numpy=2.4.6
  - pandas=3.0.3
  - pillow=12.2.0
  - pyarrow=24.0.0
  - rdkit=2026.03.3
  - scikit-learn=1.9.0
  - scipy=1.17.1
  - statsmodels=0.14.6
  - xgboost=3.2.0

  # KERMT runtime dependencies. cuik_molmaker is NVIDIA/Linux-specific and
  # therefore belongs in the HPC environment rather than environment.yaml.
  - cuik_molmaker>=0.3
  - "descriptastorus>=2.7.0.5,<3"
  - optuna
  - pytest
  - wandb
  - setuptools>=80.0.0,<82.0.0

  # Pip installs the remaining pinned packages and this local project.
  - pip:
      - -r requirements-hpc-torch.txt
