[project]

name = "chemflow"
version = "0.1.0"
description = "End-to-end cheminformatics and AI drug discovery platform"
requires-python = ">=3.11"

dependencies = [
    "streamlit",
    "pandas",
    "numpy",
    "scikit-learn",
    "scipy",
    "matplotlib",
    "plotly",
    "requests",
    "rdkit",
    "torch-geometric",
    "chembl-webresource-client",
    "chemprop>=2.2.0,<2.3",
    "lightning>=2.0",
    "filelock>=3.0",
]

[project.optional-dependencies]
desktop = [
    "PySide6>=6.8,<7",
    "PyOpenGL>=3.1.7,<4",
]

# ===========================
# CLI Entry Point
# ===========================
[project.scripts]
chemflow = "src.cli.main:main"
chemflow-desktop = "src.desktop.app:main"
admet-desktop = "src.desktop.admet_app:main"
chemflow-install-ketcher = "src.desktop.install_ketcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.desktop" = ["*.md"]
