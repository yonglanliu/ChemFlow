[project]

name = "chemflow"
version = "0.1.0"
description = "End-to-end cheminformatics and AI drug discovery platform"
requires-python = ">=3.11"

dependencies = [
    "streamlit",
    "pandas",
    "numpy",
    "scikit-learn",
    "scipy",
    "matplotlib",
    "plotly",
    "requests",
    "rdkit",
    "chembl-webresource-client",
    "chemprop>=2.2.0,<2.3",
    "lightning>=2.0",
    "filelock>=3.0",
]

[project.optional-dependencies]
desktop = [
    "PySide6>=6.8,<7",
    "PyOpenGL>=3.1.7,<4",
]
hf-graphormer = [
    "transformers==4.50.3",
    # Graphormer's legacy .pyx source uses constructs removed by Cython 3.
    "Cython>=0.29.36,<3",
]
chemberta = [
    "transformers>=4.46,<5",
]

# ===========================
# CLI Entry Point
# ===========================
[project.scripts]
chemflow = "chemflow.cli.main:main"
chemflow-desktop = "chemflow.desktop.app:main"
admet-desktop = "chemflow.desktop.admet_app:main"
chemflow-install-ketcher = "chemflow.desktop.install_ketcher:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["chemflow*", "src*"]

[tool.setuptools.package-data]
"chemflow.desktop" = ["*.md"]
"chemflow.config" = ["*.toml", "*.yaml"]
"chemflow.deep_learning.gpt.config" = ["*.toml"]
"chemflow.deep_learning.lstm" = ["*.toml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
