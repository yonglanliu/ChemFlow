[build-system]
requires = ["setuptools>=80,<82", "wheel"]
build-backend = "setuptools.build_meta"

[project]

name = "chemflow"
version = "0.1.0"
description = "End-to-end cheminformatics and AI drug discovery platform"
requires-python = ">=3.11"

dependencies = [
    "streamlit",
    "pandas",
    "numpy",
    "scikit-learn",
    "scipy",
    "matplotlib",
    "plotly",
    "requests",
    "rdkit",
    "chembl-webresource-client",
    "chemprop>=2.2.0,<2.3",
    "lightning>=2.0",
    "tensorboard>=2.14",
    "uncertainty-toolbox>=0.1.1,<0.2",
    "filelock>=3.0",
]

[project.optional-dependencies]
desktop = [
    "PySide6>=6.8,<7",
    "openai>=2,<3",
    "keyring>=25,<26",
    "PyJWT[crypto]>=2.9,<3",
]
hf-graphormer = [
    "transformers==4.50.3",
    # Graphormer's legacy .pyx source uses constructs removed by Cython 3.
    "Cython>=0.29.36,<3",
]
chemberta = [
    "transformers>=4.46,<5",
]
data-curation = [
    "openpyxl>=3.1,<4",
    "pypdf>=6,<7",
    "xlrd>=2,<3",
]
kermt = [
    "descriptastorus>=2.7.0.5,<3",
    "huggingface_hub>=0.36,<1",
    "optuna>=4",
    "protobuf>=5.29.6",
    "wandb>=0.20",
]

# ===========================
# CLI Entry Point
# ===========================
[project.scripts]
chemflow = "chemflow.cli.main:main"
alchemforge = "alchemforge.cli:main"
alchemforge-desktop = "alchemforge.desktop.main_window:main"
chemflow-desktop = "chemflow.desktop.app:main"
admet-desktop = "chemflow.desktop.admet_app:main"
chemflow-install-ketcher = "chemflow.desktop.install_ketcher:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["chemflow*", "alchemforge*", "src*"]

[tool.setuptools.package-data]
"chemflow.desktop" = ["*.md", "models/*.pt", "models/*.csv.gz"]
"chemflow.config" = ["*.toml", "*.yaml"]
"chemflow.deep_learning.gpt.config" = ["*.toml"]
"chemflow.deep_learning.lstm" = ["*.toml"]
"chemflow.deep_learning.kermt.vendor" = ["LICENSE", "UPSTREAM.md"]
"chemflow.deep_learning.kermt.vendor.kermt.data" = ["smiles_regex.txt"]
"alchemforge" = ["README.md"]
"alchemforge.desktop" = ["*.svg", "assets/*"]
"alchemforge.gromacs.resFEP" = ["*.sh", "*.toml", "mdp/*.mdp"]
"alchemforge.gromacs.rbfe" = ["*.toml"]
"alchemforge.gromacs.abfe" = ["*.sh", "*.toml"]
"alchemforge.gromacs.septop" = ["*.toml"]
"alchemforge.openfe" = ["*.sh", "*.yaml"]
"alchemforge.structure" = ["*.sh"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
