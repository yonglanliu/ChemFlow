[BaseConfig]
workdir = "./example/hf_graphormer_training/LogD_pH7_4"
task = "regression"

[DatasetConfig]
dataset_path = "./dataset/curated/physchem_multitask.csv"
smiles_column = "SMILES"
target_column = "LogD_pH7_4"
name_column = "Molecule Name"

# To compare against an existing run, point dataset_path at its data_splits.csv
# and enable the next line. Accepted values are train, val/valid, and test.
# split_column = "split"
split_type = "scaffold_balanced"
val_fraction = 0.1
test_fraction = 0.1
remove_hs = true
reorder_atoms = false

[ModelConfig]
model_name = "clefourrier/graphormer-base-pcqm4mv1"
# Use the already downloaded Hugging Face state dictionary. This avoids TLS
# certificate failures on institutional networks and makes the run offline.
checkpoint_path = "~/.cache/chemflow/graphormer/graphormer-base-pcqm4mv1.pt"
local_files_only = true
max_nodes = 512
multi_hop_max_dist = 5
spatial_pos_max = 1024
freeze_encoder = false

[TrainingConfig]
seed = 42
device = "auto"
devices = 1
strategy = "auto" # Set "ddp" only when launching through torchrun.
batch_size = 16
num_workers = 0
num_epochs = 30
progress_bar = true
# Continue from <workdir>/checkpoints/last.pt. A custom checkpoint can be set
# with resume_checkpoint = "/path/to/last.pt".
resume = false
# Set true to add/rebuild best_model/applicability.pt and calibration.json from
# the saved data_splits.csv without retraining or changing model weights.
applicability_only = false
task_loss_weighting = "uniform"
encoder_learning_rate = 1e-5
head_learning_rate = 1e-4
weight_decay = 0.01
gradient_clip = 1.0
early_stopping_patience = 8
