# Multitask regression with the pretrained CheMeleon message-passing model.

[BaseConfig]
workdir = "./example/chemeleon_training/chemeleon_multitask_admet"
task = "regression"
seed = 42

[DatasetConfig]
dataset_path = "./dataset/curated/Biogen_ExpansionRX_clearance_training.csv"
smiles_column = "SMILES"
target_column = [
    "Log_HLM_CLint",
    "Log_RLM_CLint",
    "Log_MLM_CLint",
]

# This dataset already contains Train, Validation, and Test labels.
# If the dataset already contains train, validation, and test labels, set the
# split column name here.
# split_column = "split"
split_type = "scaffold_balanced"
val_fraction = 0.1
test_fraction = 0.1

[CheMeleonTrainingConfig]
batch_size = 64
num_workers = 0
num_epochs = 30
accelerator = "auto"
devices = 1
strategy = "auto"
num_nodes = 1
sync_batchnorm = false
precision = "32-true"
deterministic = true
gradient_clip_value = 1.0
early_stopping = true
early_stopping_patience = 10
evaluate_test = true
plot_training_history = true
inspect_task_metrics = true
task_loss_weighting = "sqrt_inverse_frequency"
# Optional explicit override in target_column order:
# task_loss_weights = [1.0, 1.0, 1.0]
# Continue from <workdir>/checkpoints/last.ckpt. A custom full-state
# checkpoint can be supplied with resume_checkpoint = "/path/to/last.ckpt".
resume = false
verbose = true

[CheMeleonConfig]
# Omit pretrained_path to download and verify the official checkpoint.
freeze_epochs = 0
# Nonzero dropout regularizes fine-tuning and enables MC-dropout uncertainty
# during inference. Existing zero-dropout checkpoints must be retrained.
dropout = 0.1
ffn_hidden_dim = 256
ffn_num_layers = 1
warmup_epochs = 2
init_lr = 1e-4
max_lr = 1e-3
final_lr = 1e-4
