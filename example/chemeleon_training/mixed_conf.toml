# Mixed regression and binary classification with one shared CheMeleon encoder.

[BaseConfig]
workdir = "./example/chemeleon_training/chemeleon_mixed_multitask"
task = "mixed"
seed = 42

[DatasetConfig]
# Replace this path and the target names with columns from your dataset.
# Classification labels must be 0, 1, or empty.
dataset_path = "./dataset/your_mixed_multitask_data.csv"
smiles_column = "SMILES"
target_column = ["solubility", "active"]
task_types = ["regression", "classification"]
split_type = "scaffold_balanced"
val_fraction = 0.1
test_fraction = 0.1

[CheMeleonTrainingConfig]
batch_size = 64
num_workers = 0
num_epochs = 30
accelerator = "auto"
devices = 1
strategy = "auto"
num_nodes = 1
sync_batchnorm = false
precision = "32-true"
deterministic = true
gradient_clip_value = 1.0
early_stopping = true
early_stopping_patience = 10
evaluate_test = true
plot_training_history = true
inspect_task_metrics = true
class_balance = false
task_loss_weighting = "sqrt_inverse_frequency"
verbose = true

[CheMeleonConfig]
# Omit pretrained_path to download and verify the official checkpoint.
freeze_epochs = 0
# Nonzero dropout regularizes fine-tuning and enables MC-dropout uncertainty
# during inference. Existing zero-dropout checkpoints must be retrained.
dropout = 0.1
ffn_hidden_dim = 256
ffn_num_layers = 1
warmup_epochs = 2
init_lr = 1e-4
max_lr = 1e-3
final_lr = 1e-4
