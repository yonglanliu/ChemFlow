# ============================================================
# Base
# ============================================================

[BaseConfig]

workdir = "./example/graphormer_training/logS"

task = "regression"

seed = 42


# ============================================================
# Dataset
# ============================================================

[DatasetConfig]

dataset_path = "./dataset/ADMET/ExpansionRX/expansion_data_train.csv"

# Optional independent test CSV. When enabled, set test_fraction = 0.0.
# test_dataset_path = "/path/to/external_test.csv"

smiles_column = "SMILES"
target_column = "LogS"

val_fraction = 0.1
test_fraction = 0.1

# random | random_with_repeated_smiles | scaffold_balanced |
# kennard_stone | kmeans
split_type = "scaffold_balanced"

preprocess_batch_size = 100000

max_nodes = 128
multi_hop_max_dist = 5
spatial_pos_max = 1024

reorder_atoms = false
remove_hs = true

seed = 42


# ============================================================
# Featurizer
# ============================================================

[FeaturizerConfig]

multi_hop_max_dist = 5
remove_hs = true
reorder_atoms = false


# ============================================================
# Training
# ============================================================

[GraphormerTrainingConfig]

seed = 42

batch_size = 16
eval_batch_size = 16
num_epochs = 20
num_workers = 0

# ------------------------------------------------------------
# Learning settings
# ------------------------------------------------------------

learning_rate = 1e-4

encoder_learning_rate = 1e-5
lora_learning_rate = 1e-4
head_learning_rate = 1e-4

weight_decay = 0.01

scheduler = "cosine"

gradient_clip_value = 1.0


# ------------------------------------------------------------
# Plotting settings
# ------------------------------------------------------------

plot_training_history = true
plot_dpi = 300


# ------------------------------------------------------------
# Resume settings
# ------------------------------------------------------------

resume = false

# resume_checkpoint = "./example/graphormer_training/logS/checkpoints/last_model.pt"


# ------------------------------------------------------------
# Early stopping settings
# ------------------------------------------------------------

early_stopping = true

early_stopping_patience = 10

monitor_metric = "val_rmse"
# Options:
#   "val_loss"
#   "val_mae"
#   "val_rmse"
#   "val_r2"

monitor_mode = "min"
# min:
#   val_loss / val_mae / val_rmse
#
# max:
#   val_r2


# ------------------------------------------------------------
# Hold-out test evaluation
# ------------------------------------------------------------

evaluate_test = true
plot_evaluation_metrics = true


# ============================================================
# Graphormer model and fine-tuning
# ============================================================

[GraphormerConfig]

# A compatible PCQM4M v1 Graphormer checkpoint is downloaded from Hugging Face
# and cached when pretrained_path is omitted. Set use_pretrained = false to train
# from scratch, or set pretrained_path to use a local checkpoint.
use_pretrained = true
# pretrained_path = "/path/to/custom_graphormer_checkpoint.pt"
# pretrained_url = "https://example.org/custom_checkpoint.pt"
# pretrained_sha256 = "optional_sha256_for_custom_checkpoint"

loss_type = "laplace_nll"
# Options:
#   "huber"
#   "mse"
#   "mae"
#   "laplace_nll"
#   "gaussian_nll"


# ------------------------------------------------------------
# Backbone fine-tuning
# ------------------------------------------------------------

freeze_encoder = true

use_lora = true


# ------------------------------------------------------------
# Prediction head
# ------------------------------------------------------------

head_intermediate_dim = 256

head_dropout = 0.1


# ============================================================
# LoRA
# ============================================================

lora_target = "attention"
# Options:
#   attention
#   ffn
#   all

lora_r = 8

lora_alpha = 16.0

lora_dropout = 0.1

apply_lora_to_k_proj = false


# ------------------------------------------------------------
# FFN LoRA
# ------------------------------------------------------------

lora_ffn_r = 8

lora_ffn_alpha = 16.0

lora_use_fc2 = false
