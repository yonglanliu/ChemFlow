# ============================================================
# Base
# ============================================================

[BaseConfig]

workdir = "/Users/yonglanliu/Desktop/ChemFlow/expansionrx_mtl_training/Multtask_to_OneAdaptor"

task = "multitask"

seed = 42


# ============================================================
# Dataset
# ============================================================

[DatasetConfig]

dataset_path = "/Users/yonglanliu/Desktop/ChemFlow/dataset/ADMET/ExpansionRX/expansion_data_train.csv"

smiles_column = "SMILES"
target_column = ["LogD", "LogS", "Log(MLM_Clint)", "Log(HLM_Clint)", "Log(Caco2_Papp)", "Log(Caco2_ER)", "Log(MPPB)", "Log(MBPB)", "Log(MGMB)"]
task_names = ["LogD", "LogS", "Log(MLM_Clint)", "Log(HLM_Clint)", "Log(Caco2_Papp)", "Log(Caco2_ER)", "Log(MPPB)", "Log(MBPB)", "Log(MGMB)"]

# Optional: set this when the dataset already contains split labels like train/val/test.
# If omitted, the loader falls back to random val/test splitting.
split_column = "split"

val_fraction = 0.1
test_fraction = 0.1

preprocess_batch_size = 100000

max_nodes = 128
multi_hop_max_dist = 5
spatial_pos_max = 1024

reorder_atoms = false
remove_hs = true

seed = 42


# ============================================================
# Featurizer
# ============================================================

[FeaturizerConfig]

multi_hop_max_dist = 5
remove_hs = true
reorder_atoms = false


# ============================================================
# Training
# ============================================================

[GraphormerTrainingConfig]

seed = 42

batch_size = 16
eval_batch_size = 16
num_epochs = 100
num_workers = 0

# --- Learning Settings ---
learning_rate = 1e-4
encoder_learning_rate = 1e-5
lora_learning_rate = 1e-4
head_learning_rate = 1e-4
weight_decay = 0.01
scheduler = "cosine"
gradient_clip_value = 1.0

# --- Plotting Setting ---
plot_training_history = true
plot_dpi = 300

# --- Resume Settings ---
resume = false
resume_checkpoint = "/Users/yonglanliu/Desktop/ChemFlow/graphormer_multitask_training/checkpoints/last_model.pt"

# --- Early Stopping Settings ---
early_stopping = true
early_stopping_patience = 20
monitor_metric = "val_rmse"  # Options: "val_loss", "val_mae", "val_rmse", "val_r2"
monitor_mode = "min"  # Options: "min", "max"

# --- Evaluate Hold-out Test Set ---
evaluate_test = true
plot_evaluation_metrics = true


# ============================================================
# Graphormer model and fine-tuning
# ============================================================

[GraphormerConfig]

pretrained_path = "src/deep_learning/graphormer/pretrained/graphormer-base-pcqm4mv1.pt"
num_tasks = 9
loss_type = "laplace_NLL"  # 'mse', 'mae', 'huber', 'laplace_nll', or 'gaussian_nll'

# Automatic availability-based task weighting.
# Supported methods: "inverse", "sqr_inverse"/"sqrt_inverse", or "customed".
# Leave task_weights unset to let the trainer compute it automatically.
task_weight_method = "sqr_inverse"  # "inverse", "sqrt_inverse", or "customed".
# task_weights = [0.09, 0.10, 0.10, 0.12, 0.11, 0.11, 0.15, 0.12, 0.10]


# Multi-adaptor / grouped task-head settings
# Group tasks by similar assay families and share one adaptor per group.
sharing_type = "hard"
num_adapters = 4
task_groups = [[0, 1], [2, 3], [4, 5], [6, 7, 8]]

freeze_encoder = true
use_lora = true

head_intermediate_dim = 256
head_dropout = 0.1
adaptor_bottleneck_dim = 128
adaptor_dropout = 0.1
adaptor_gate = true
adaptor_gate_fn = "tanh"

# LoRA
lora_target = "all"  # attention | ffn | all

lora_r = 8
lora_alpha = 16.0
lora_dropout = 0.1
apply_lora_to_k_proj = false

lora_ffn_r = 8
lora_ffn_alpha = 16.0
lora_use_fc2 = false