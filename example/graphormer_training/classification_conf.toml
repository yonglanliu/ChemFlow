# ============================================================
# Base
# ============================================================

[BaseConfig]

workdir = "/Users/yonglanliu/Desktop/ChemFlow/graphormer_training_classification"

task = "classification"

seed = 42


# ============================================================
# Dataset
# ============================================================

[DatasetConfig]

dataset_path = "/Users/yonglanliu/Desktop/ChemFlow/dataset/combined/pi3k_alpha_combined_labeled.csv"

# Optional independent test CSV. When enabled, set test_fraction = 0.0.
# test_dataset_path = "/path/to/external_test.csv"

smiles_column = "SMILES"
target_column = "class_id"

val_fraction = 0.1
test_fraction = 0.1

# random | random_with_repeated_smiles | scaffold_balanced |
# kennard_stone | kmeans
split_type = "scaffold_balanced"

preprocess_batch_size = 100000

max_nodes = 128
multi_hop_max_dist = 5
spatial_pos_max = 1024

reorder_atoms = false
remove_hs = true

seed = 42


# ============================================================
# Featurizer
# ============================================================

[FeaturizerConfig]

multi_hop_max_dist = 5
remove_hs = true
reorder_atoms = false


# ============================================================
# Training
# ============================================================

[GraphormerTrainingConfig]

seed = 42


# ------------------------------------------------------------
# Cross-validation
# ------------------------------------------------------------

cross_validation = false

# If CV is enabled later:
# cv_splits = 5
# cv_seed = 42


# ------------------------------------------------------------
# Batch / Epoch Settings
# ------------------------------------------------------------

batch_size = 16
eval_batch_size = 16

num_epochs = 50

num_workers = 0


# ------------------------------------------------------------
# Learning Settings
# ------------------------------------------------------------

learning_rate = 1e-4

encoder_learning_rate = 1e-5
lora_learning_rate = 1e-4
head_learning_rate = 1e-4

weight_decay = 0.01

scheduler = "cosine"

gradient_clip_value = 1.0


# ------------------------------------------------------------
# Plotting Settings
# ------------------------------------------------------------

plot_training_history = true
plot_dpi = 300


# ------------------------------------------------------------
# Resume Settings
# ------------------------------------------------------------

resume = false

resume_checkpoint = "/Users/yonglanliu/Desktop/ChemFlow/graphormer_training_classification/checkpoints/last_model.pt"


# ------------------------------------------------------------
# Early Stopping Settings
# ------------------------------------------------------------

early_stopping = true

early_stopping_patience = 10

monitor_metric = "val_roc_auc"

monitor_mode = "max"


# ------------------------------------------------------------
# Hold-out Test Evaluation
# ------------------------------------------------------------

evaluate_test = true

plot_evaluation_metrics = true


# ============================================================
# Graphormer Model and Fine-Tuning
# ============================================================

[GraphormerConfig]


# ------------------------------------------------------------
# Classification settings
# ------------------------------------------------------------

# Binary classification
num_classes = 1

loss_type = "bce"

# Replace with value calculated from TRAINING split only
positive_weight = 0.572


# ------------------------------------------------------------
# Multi-class example
# ------------------------------------------------------------

# num_classes = 4
# loss_type = "cross_entropy"
#
# class_weights = [
#     1.0,
#     2.0,
#     3.0,
#     4.0
# ]


# ------------------------------------------------------------
# Pretrained Graphormer
# ------------------------------------------------------------

# Download and cache a compatible PCQM4M v1 checkpoint when omitted.
use_pretrained = true
# pretrained_path = "/path/to/custom_graphormer_checkpoint.pt"


# ============================================================
# Classification Head
# ============================================================

head_intermediate_dim = 256

head_dropout = 0.1


# ============================================================
# Encoder Fine-Tuning
# ============================================================

freeze_encoder = true

use_lora = true


# ============================================================
# LoRA
# ============================================================

# attention | ffn | all
lora_target = "all"

lora_r = 8

lora_alpha = 16.0

lora_dropout = 0.1

apply_lora_to_k_proj = false


# ------------------------------------------------------------
# FFN LoRA
# ------------------------------------------------------------

lora_ffn_r = 8

lora_ffn_alpha = 16.0

lora_use_fc2 = false
