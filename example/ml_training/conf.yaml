workdir: ./example/ml_training/logD/ecfp4_desc
task_type: regression

# ============================================================
# Data
# ============================================================
data:
  data_file: ./example/ml_training/single_task_LogD.csv
  X_col: SMILES
  y_col: LogD

  # Only used for classification.
  # n_classes: 2


# ============================================================
# Featurization
# ============================================================
featurization:
  features:
    - ecfp4
    # - ecfp6
    - descriptor
    # - maccs

  fp_bits: 2048


# ============================================================
# Data split
# ============================================================
data_split:
  split_method: splitted  # Supported methods: random, scaffold, stratified, splitted, clustered, butina
  split_column: split  # if split_method is "splitted", this column will be used to split the data into train/valid/test sets

  test_fraction: 0.1
  valid_fraction: 0.1

  random_seed: 42

  # Save featurized train/test/validation arrays
  save_split_data: true

  save_dir: ./example/ml_training/logD/ecfp4_desc/split_data

  split_name: single_task_logd_random_split


# ============================================================
# Models
# ============================================================
models:
  - model_name: Random Forest
    estimator: RandomForestRegressor

  - model_name: XGBoost
    estimator: XGBRegressor

  - model_name: SVM_RBF
    estimator: SVR

  - model_name: LightGBM
    estimator: LGBMRegressor


# ============================================================
# Hyperparameter tuning
# ============================================================
hyperparameter_tuning: true

n_iter: 50
cv: 5
n_jobs: -1

scoring_metrics:
  - r2
  - root_mean_squared_error
  - mean_absolute_error
  - pearson
  - spearman
  - kendall

refit_metric: root_mean_squared_error