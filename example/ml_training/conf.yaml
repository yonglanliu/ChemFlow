workdir: ./example/ml_training/HLM_Clint/ecfp4
task_type: regression

# ============================================================
# Data
# ============================================================
data:
  data_file: ./dataset/curated/Biogen_ExpansionRX_clearance_training.csv
  X_col: SMILES
  y_col: Log_HLM_CLint

  # Only used for classification.
  # n_classes: 2


# ============================================================
# Featurization
# ============================================================
featurization:
  # Select one or more supported representations. Their vectors are
  # concatenated in the listed order.
  features:
    - ecfp4
    # - rdkit2d
    # - ecfp6
    # - fcfp4
    # - fcfp6
    # - avalon
    # - erg
    # - descriptor  # legacy nine-descriptor physicochemical subset
    # - maccs

  fp_bits: 2048

  # Descriptor-only reduction is fitted independently inside each CV fold.
  descriptor_correlation_threshold: 0.95

  # Optional supervised selection for linear and SVM estimators only.
  # Tree estimators keep fingerprint bits unchanged apart from the universal
  # zero-variance filter.
  descriptor_model_selection: false
  descriptor_selection_threshold: mean
  descriptor_selection_estimators: 128


# ============================================================
# Data split
# ============================================================
data_split:
  # Use "predefined" when data_file already has train/val/test assignments.
  # Supported methods: random, scaffold, predefined, cluster, butina
  split_method: scaffold
  split_column: split  # Used only when split_method is "predefined"

  test_fraction: 0.1
  valid_fraction: 0.1

  random_seed: 42

  # Save the featurized NPZ and a readable CSV containing a "split" column.
  save_split_data: true

  save_dir: ./example/ml_training/HLM_Clint/split_data

  split_name: single_task_HLM_Clint_scaffold_split


# ============================================================
# Models
# ============================================================
models:
  # - model_name: Random Forest
  #   estimator: RandomForestRegressor

  # - model_name: XGBoost
  #   estimator: XGBRegressor

  # - model_name: SVM_RBF
  #   estimator: SVR
  #   # Exact RBF SVR scales poorly on large molecular datasets. Override the
  #   # global 50-candidate/5-fold search for this model only (8 x 3 = 24 fits).
  #   n_iter: 8
  #   cv: 3
  #   model_params:
  #     cache_size: 1024  # MB per concurrently fitted SVR process
  #   param_grid:
  #     C: [0.1, 1.0, 10.0]
  #     gamma: [scale, 0.001, 0.01]
  #     epsilon: [0.05, 0.1, 0.2]

  - model_name: LightGBM
    estimator: LGBMRegressor


# ============================================================
# Hyperparameter tuning
# ============================================================
hyperparameter_tuning: true

n_iter: 50
cv: 5
# Inner cross-validation used only for hyperparameter selection:
#   cv                 - shuffled K-fold (stratified for classification)
#   scaffold-grouped   - keep each Bemis-Murcko scaffold in one fold
cv_strategy: scaffold-grouped
cv_random_seed: 42
n_jobs: -1

scoring_metrics:
  - r2
  - root_mean_squared_error
  - mean_absolute_error
  - pearson
  - spearman
  - kendall

refit_metric: root_mean_squared_error
